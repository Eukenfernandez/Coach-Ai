version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-y-patch:
        update-types: [minor, patch]
    ignore:
      # Majors de runtime/plataforma se actualizan a mano y con pruebas en dispositivo
      - dependency-name: "@capacitor/*"
        update-types: [version-update:semver-major]
      - dependency-name: electron
        update-types: [version-update:semver-major]
      - dependency-name: firebase
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /fns
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-y-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
